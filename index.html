<!DOCTYPE html>
<html lang="en"> 

<head> 

    <meta charset="UTF-8"> 

    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes"> 

    <title>TaskFlow - Personal Task Manager</title> 

    <link rel="stylesheet" href="style.css"> 

</head> 

<body> 

    <div class="container"> 

        <header> 

            <h1>📋 TaskFlow</h1> 

            <p>Full-Stack Task Manager - NQF Level 4 Systems Development</p> 

            <div class="server-status" id="serverStatus"> 

                <span class="status-dot"></span> 

                Checking server... 

            </div> 

        </header> 

 

        <div class="add-task-section"> 

            <h2>➕ Add New Task</h2> 

            <form id="taskForm"> 

                <div class="form-group"> 

                    <input type="text" id="title" placeholder="Task title" required> 

                </div> 

                <div class="form-group"> 

                    <textarea id="description" placeholder="Description (optional)" rows="2"></textarea> 

                </div> 

                <div class="form-row"> 

                    <div class="form-group"> 

                        <input type="date" id="dueDate"> 

                    </div> 

                    <div class="form-group"> 

                        <select id="priority"> 

                            <option value="Low">🟢 Low Priority</option> 

                            <option value="Medium" selected>🟡 Medium Priority</option> 

                            <option value="High">🔴 High Priority</option> 

                        </select> 

                    </div> 

                </div> 

                <button type="submit" class="btn btn-primary">➕ Add Task</button> 

            </form> 

        </div> 

 

        <div class="task-list-section"> 

            <h2>📝 My Tasks</h2> 

            <div class="filter-buttons"> 

                <button class="filter-btn active" data-filter="all">All Tasks</button> 

                <button class="filter-btn" data-filter="pending">Pending</button> 

                <button class="filter-btn" data-filter="completed">Completed</button> 

            </div> 

            <div id="taskList" class="task-list"> 

                <div class="loading">Loading tasks from server...</div> 

            </div> 

        </div> 

    </div> 

    <script src="app.js"></script> 

</body> 

</html>
